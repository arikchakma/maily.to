name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run --filter @maily-to/web typegen
      - run: pnpm run check

      - name: Publish @maily-to/shared
        run: pnpm publish --provenance --access public --no-git-checks
        working-directory: packages/shared

      - name: Publish @maily-to/ui
        run: pnpm publish --provenance --access public --no-git-checks
        working-directory: packages/ui

      - name: Publish @maily-to/migration
        run: pnpm publish --provenance --access public --no-git-checks
        working-directory: packages/migration

      - name: Publish @maily-to/render
        run: pnpm publish --provenance --access public --no-git-checks
        working-directory: packages/render

      - name: Publish @maily-to/core
        run: pnpm publish --provenance --access public --no-git-checks
        working-directory: packages/core

      - name: Generate GitHub Changelog
        run: pnpx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

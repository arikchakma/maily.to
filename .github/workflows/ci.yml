name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - run: vp install
      - run: vp run -r build
      - run: vp run @maily-to/web#typegen
      - run: vp check
      # Core belongs to the browser job, and a filtered run also selects the
      # workspace root, whose test script would pull core back in.
      - run: vp run -F './packages/*' -F './apps/*' -F '!@maily-to/core' test

  browser:
    runs-on: ubuntu-latest
    # The image holds the browsers and their system packages. Keep its tag on
    # the playwright version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - run: vp install
      - run: vp run -r build
      - run: vp run -F '@maily-to/core' test
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: vp exec playwright test --project=${{ matrix.browser }} --retries=2 --workers=4
